plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.callmyphone'
    compileSdk 36

    defaultConfig {
        applicationId 'com.openai.callmyphone'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
