name: Build VideoMaker AI GPU Server

on:
  push:
    branches: [ "videomaker-ai-build" ]
    paths:
      - "VideoMakerAI_Server/**"
      - ".github/workflows/videomaker-ai-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: VideoMakerAI_Server
          file: VideoMakerAI_Server/Dockerfile
          push: true
          tags: ghcr.io/tal42367/videomaker-ai-gpu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
