name: Build CallMyPhone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon --non-interactive :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CallMyPhone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallMyPhone-APK
          path: CallMyPhone.apk
          if-no-files-found: error
